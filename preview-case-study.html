  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

url(\"4ee556a8-6b90-4751-afbf-29c76cc38a47\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"887c7c27-a324-46af-81bb-4db8a11cea76\"><\u002Fscript>\n<style>\n@font-face{font-family:'Gladia';src:url(\"c45dbdca-fda1-4754-abd5-e7cac5deec2e\") format('truetype');font-weight:400 900;font-display:swap;}\n:root{\n  --paper:#E5E5D7; --white:#FBFBF6; --ink:#1C1B19; --ink-soft:#2E4040;\n  --green:#1F5D4C; --green-lt:#6A9E90; --cta:#A07840; --cta-dk:#8A652F;\n  --dark:#151510; --dark-2:#100F0B; --tile:#1c1c16;\n  --line-d:rgba(238,239,231,.16); --line-l:rgba(28,27,25,.16);\n  --serif:'Bricolage Grotesque',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif; --mono:'Space Grotesk',ui-monospace,monospace;\n  --he:'Heebo',system-ui,sans-serif; --gld:'Gladia','Heebo',serif;\n  --ease:cubic-bezier(.16,.84,.32,1);\n}\n*{box-sizing:border-box;margin:0;}\na{color:inherit;text-decoration:none;}\n.proto{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip;}\n.proto.is-he{direction:rtl;font-family:var(--he);}\n.proto h1,.proto h2,.proto h3,.proto h4{margin:0;font-family:var(--serif);font-weight:300;line-height:.9;letter-spacing:-.03em;}\n.proto.is-he h1,.proto.is-he h2,.proto.is-he h3,.proto.is-he h4{font-family:var(--he);letter-spacing:-.02em;line-height:1.02;}\n.proto ::selection{background:var(--cta);color:#fff;}\n.wrap{max-width:1360px;margin-inline:auto;padding-inline:clamp(20px,5vw,64px);}\n.pad{padding-block:clamp(64px,9vw,132px);}\n.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--cta);display:block;margin-bottom:20px;}\n.proto.is-he .eyebrow{font-family:var(--he);letter-spacing:.06em;font-weight:600;text-transform:none;}\n.stack .lt{font-weight:300;}\n.stack .hv{font-weight:800;text-transform:uppercase;letter-spacing:-.02em;}\n.proto.is-he .stack .hv{text-transform:none;font-weight:900;}\n.proto.is-he .gld{font-family:var(--gld);font-weight:400;letter-spacing:0;}\n.edot-after::after{content:\".\";color:var(--cta);display:inline-block;font-weight:inherit;}\n.edot-after-g::after{content:\".\";color:var(--green-lt);display:inline-block;font-weight:inherit;}\n.s-light{background:var(--paper);color:var(--ink);}\n.s-white{background:var(--white);color:var(--ink);}\n.s-dark{background:var(--dark);color:#EEEFE7;}\n.s-dark2{background:var(--dark-2);color:#EEEFE7;}\n\n/* Brand wordmark + genesis (from Home v3) */\n.brand .brand-name{display:block;width:9.4em;}\n.brand .brand-name svg{display:block;width:100%;height:auto;}\n.nav.nav-hidden{opacity:0;transform:translateY(-8px);}\n.genesis-overlay{position:fixed;inset:0;z-index:120;pointer-events:none;}\n.genesis-mark{position:fixed;top:0;left:0;width:26px;height:29px;box-sizing:border-box;color:#EEEFE7;will-change:transform;}\n.genesis-mark svg{display:block;width:100%;height:100%;}\n\n/* ===== NAV ===== */\n.nav{position:fixed;top:0;inset-inline:0;z-index:80;transition:background .35s,box-shadow .35s,border-color .35s,opacity .55s ease,transform .55s ease;border-bottom:1px solid transparent;}\n.nav-in{display:flex;align-items:center;gap:24px;padding:18px clamp(20px,5vw,64px);}\n.nav.solid{background:rgba(229,229,215,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:var(--line-l);}\n.brand{display:inline-flex;align-items:center;gap:11px;margin-inline-end:auto;color:#EEEFE7;min-width:0;flex-shrink:1;}\n.nav.solid .brand{color:var(--ink);}\n.brand-text{display:flex;flex-direction:column;line-height:1;}\n.brand-tag{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--green-lt);margin-top:5px;display:block;}\n.nav.solid .brand-tag{color:var(--green);}\n.proto.is-he .brand-tag{font-family:var(--he);letter-spacing:.08em;text-transform:none;font-weight:600;font-size:11px;}\n.brand .mark{width:26px;height:29px;flex-shrink:0;}\n.brand .mark .o{animation:markPulse 4.5s ease-in-out infinite;}\n@keyframes markPulse{0%,100%{opacity:.55;}50%{opacity:1;}}\n.brand .bname{font-family:var(--mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;}\n.proto.is-he .brand .bname{font-family:var(--he);letter-spacing:.04em;font-weight:700;text-transform:none;font-size:17px;}\n.nav-links{display:flex;gap:6px;}\n.nav-links a{font-family:var(--mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:#EEEFE7;padding:8px 12px;border-radius:8px;transition:opacity .2s,color .35s;opacity:.82;}\n.proto.is-he .nav-links a{font-family:var(--he);font-weight:600;text-transform:none;letter-spacing:0;font-size:15px;}\n.nav.solid .nav-links a{color:var(--ink);}\n.nav-links a:hover{opacity:1;}\n.nav-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}\n.pb-lang{display:inline-flex;border:1px solid currentColor;border-radius:999px;overflow:hidden;color:#EEEFE7;opacity:.85;flex-shrink:0;white-space:nowrap;}\n.nav.solid .pb-lang{color:var(--ink);}\n.pb-lang button{background:transparent;border:0;color:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.08em;padding:7px 11px;line-height:1;}\n.pb-lang button.on{background:var(--cta);color:#fff;}\n.nav-cta{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:11px 18px;border-radius:999px;background:var(--cta);color:#fff;transition:background .25s,transform .25s;flex-shrink:0;white-space:nowrap;}\n.proto.is-he .nav-cta{font-family:var(--he);font-weight:600;text-transform:none;letter-spacing:0;}\n.nav-cta:hover{background:var(--cta-dk);color:#fff;transform:translateY(-2px);}\n.nav-burger{display:none;background:transparent;border:0;padding:8px;margin-inline-start:0;color:#EEEFE7;cursor:pointer;width:44px;height:44px;align-items:center;justify-content:center;border-radius:10px;transition:background .2s,color .35s;}\n.nav.solid .nav-burger{color:var(--ink);}\n.nav-burger:hover{background:rgba(238,239,231,.10);}\n.nav.solid .nav-burger:hover{background:rgba(28,27,25,.06);}\n.nav-burger .bg-ic{width:22px;height:22px;position:relative;display:block;}\n.nav-burger .bg-ic i{position:absolute;left:0;right:0;height:1.6px;background:currentColor;border-radius:2px;transition:transform .35s var(--ease),top .3s var(--ease),opacity .2s;}\n.nav-burger .bg-ic i:nth-child(1){top:6px;}\n.nav-burger .bg-ic i:nth-child(2){top:11px;}\n.nav-burger .bg-ic i:nth-child(3){top:16px;}\n.nav.menu-open .nav-burger .bg-ic i:nth-child(1){top:11px;transform:rotate(45deg);}\n.nav.menu-open .nav-burger .bg-ic i:nth-child(2){opacity:0;}\n.nav.menu-open .nav-burger .bg-ic i:nth-child(3){top:11px;transform:rotate(-45deg);}\n\n/* mobile drawer */\n.nav-drawer{position:fixed;inset:0;z-index:79;pointer-events:none;opacity:0;transition:opacity .35s var(--ease);}\n.nav-drawer.open{opacity:1;pointer-events:auto;}\n.nav-drawer .nd-scrim{position:absolute;inset:0;background:rgba(16,16,11,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}\n.nav-drawer .nd-panel{position:absolute;top:0;inset-inline-end:0;height:100svh;width:min(86vw,360px);background:var(--dark);color:#EEEFE7;padding:clamp(80px,14vh,110px) clamp(24px,6vw,36px) 32px;display:flex;flex-direction:column;gap:26px;transform:translateX(105%);transition:transform .45s var(--ease);border-inline-start:1px solid var(--line-d);}\n.proto.is-he .nav-drawer .nd-panel{transform:translateX(-105%);}\n.nav-drawer.open .nd-panel,.proto.is-he .nav-drawer.open .nd-panel{transform:none;}\n.nd-links{display:flex;flex-direction:column;gap:2px;}\n.nd-links a{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:#EEEFE7;padding:14px 4px;border-bottom:1px solid var(--line-d);opacity:.9;transition:opacity .2s,color .25s,padding .25s;}\n.proto.is-he .nd-links a{font-family:var(--he);letter-spacing:0;text-transform:none;font-weight:600;font-size:17px;}\n.nd-links a:hover{opacity:1;color:var(--cta);padding-inline-start:10px;}\n.nd-close{position:absolute;top:18px;inset-inline-end:18px;width:44px;height:44px;border-radius:50%;background:transparent;border:1px solid var(--line-d);color:#EEEFE7;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s,transform .3s var(--ease),color .2s;}\n.nd-close:hover{background:rgba(238,239,231,.08);border-color:var(--cta);color:var(--cta);transform:rotate(90deg);}\n.nd-foot{margin-top:auto;display:flex;flex-direction:column;gap:18px;}\n.nd-foot .pb-lang{align-self:flex-start;color:#EEEFE7;}\n.nd-foot .nav-cta{align-self:stretch;text-align:center;}\n\n@media(max-width:900px){\n  .nav-in{gap:12px;padding:14px clamp(16px,4vw,24px);}\n  .nav-links{display:none;}\n  .nav-right .pb-lang,.nav-right .nav-cta{display:none;}\n  .nav-burger{display:inline-flex;}\n  .brand .bname,.brand .brand-name{max-width:58vw;}\n}\n@media(min-width:901px){\n  .nav-drawer{display:none;}\n}\n\n\n/* Breadcrumb */\n.breadcrumb{padding:130px 0 0;}\n.breadcrumb .wrap{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}\n.proto.is-he .breadcrumb .wrap{font-family:var(--he);letter-spacing:.02em;text-transform:none;font-weight:600;}\n.breadcrumb a{color:var(--ink-soft);transition:color .2s;}\n.breadcrumb a:hover{color:var(--cta);}\n.breadcrumb .sep{opacity:.5;}\n\n/* Case hero */\n.case-hero{padding-block:clamp(40px,6vw,80px) clamp(30px,4vw,56px);}\n.case-hero .row{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(28px,4vw,72px);align-items:end;}\n.case-title{font-size:clamp(44px,7.4vw,116px);line-height:.86;color:var(--ink);}\n.case-title .mask{display:block;overflow:hidden;padding-block:.04em;}\n.case-title .mask > span{display:block;transform:translateY(112%);transition:transform 1s var(--ease);will-change:transform;}\n.case-hero.in .case-title .mask:nth-child(1) > span{transform:translateY(0);transition-delay:.0s;}\n.case-hero.in .case-title .mask:nth-child(2) > span{transform:translateY(0);transition-delay:.08s;}\n.case-hero .eyebrow{opacity:0;transform:translateY(12px);transition:opacity .7s var(--ease),transform .7s var(--ease);}\n.case-hero.in .eyebrow{opacity:1;transform:none;}\n.case-lead{font-size:clamp(17px,1.4vw,20px);color:var(--ink-soft);line-height:1.55;max-width:44ch;}\n@media(max-width:820px){ .case-hero .row{grid-template-columns:1fr;gap:24px;align-items:flex-start;} }\n\n/* Meta strip */\n.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,3vw,40px);border-top:1px solid var(--line-l);border-bottom:1px solid var(--line-l);padding:clamp(22px,2.4vw,32px) 0;}\n.meta-item .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:10px;}\n.proto.is-he .meta-item .k{font-family:var(--he);letter-spacing:.02em;text-transform:none;font-weight:600;}\n.meta-item .v{font-family:var(--serif);font-size:clamp(17px,1.6vw,22px);color:var(--ink);line-height:1.15;font-weight:400;letter-spacing:-.01em;}\n.proto.is-he .meta-item .v{font-family:var(--he);font-weight:600;}\n.meta-item .v a{color:var(--cta);}\n.meta-item .v a:hover{color:var(--cta-dk);}\n@media(max-width:720px){ .meta{grid-template-columns:1fr 1fr;gap:24px;} }\n\n/* Cover image */\n.cover{padding-block:clamp(28px,4vw,60px);}\n.cover-media{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--tile);box-shadow:0 60px 100px -60px rgba(28,27,25,.4);}\n.cover-media image-slot{position:absolute;inset:0;width:100%;height:100%;}\n\n/* Two-column overview */\n.overview{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);}\n.overview h3{font-size:clamp(24px,2.6vw,34px);color:var(--ink);margin-bottom:18px;line-height:1;}\n.overview p{font-size:16.5px;color:var(--ink-soft);line-height:1.65;max-width:52ch;}\n.overview p + p{margin-top:14px;}\n@media(max-width:820px){ .overview{grid-template-columns:1fr;gap:36px;} }\n\n/* Big statement / beat */\n.beat h2{font-size:clamp(32px,5vw,72px);line-height:.94;max-width:20ch;}\n.beat p{font-size:clamp(16px,1.4vw,19px);color:var(--ink-soft);max-width:56ch;margin-top:22px;}\n\n/* Feature list \"what I built\" */\n.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(22px,2.6vw,40px);margin-top:clamp(34px,4vw,52px);}\n.feat{border-top:1px solid var(--line-l);padding-top:22px;}\n.feat .n{font-family:var(--mono);font-size:12px;color:var(--cta);letter-spacing:.14em;}\n.proto.is-he .feat .n{font-family:var(--he);letter-spacing:.02em;}\n.feat h4{font-size:clamp(19px,1.8vw,24px);color:var(--ink);margin:14px 0 10px;line-height:1.1;}\n.feat p{color:var(--ink-soft);font-size:15px;line-height:1.55;}\n@media(max-width:820px){ .feats{grid-template-columns:1fr;gap:8px;} .feat{padding-top:26px;} }\n\n/* Gallery */\n.gal{display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,28px);margin-top:clamp(30px,4vw,50px);}\n.gal .shot{position:relative;aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:var(--tile);}\n.gal .shot.wide{grid-column:1 / -1;aspect-ratio:16/6;}\n.gal image-slot{position:absolute;inset:0;width:100%;height:100%;}\n\n/* Bento grid variant */\n.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:clamp(140px,15vw,220px);gap:clamp(14px,1.6vw,24px);margin-top:clamp(28px,4vw,48px);}\n.bento .shot{position:relative;border-radius:10px;overflow:hidden;background:var(--tile);aspect-ratio:auto;}\n.bento .b1{grid-column:1 / span 4;grid-row:1 / span 1;}\n.bento .b2{grid-column:5 / span 2;grid-row:1 / span 2;}\n.bento .b3{grid-column:1 / span 2;grid-row:2 / span 1;}\n.bento .b4{grid-column:3 / span 2;grid-row:2 / span 1;}\n.bento image-slot{position:absolute;inset:0;width:100%;height:100%;}\n@media(max-width:720px){ .gal{grid-template-columns:1fr;} .gal .shot.wide{aspect-ratio:16/10;} .bento{grid-template-columns:1fr;grid-auto-rows:auto;} .bento .shot{aspect-ratio:16/10;grid-column:1 / -1 !important;grid-row:auto !important;} }\n\n/* Results — dark stat band */\n.results{background:var(--dark);color:#EEEFE7;border-radius:20px;padding:clamp(40px,5vw,72px);position:relative;overflow:hidden;}\n.results::before{content:\"\";position:absolute;inset:0;background:radial-gradient(70% 100% at 100% 0%,rgba(31,93,76,.32),transparent 60%);}\n.results-in{position:relative;z-index:1;}\n.results .eyebrow{color:var(--green-lt);}\n.results h2{color:#F4F7F5;font-size:clamp(28px,4vw,56px);max-width:22ch;line-height:.94;}\n.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;margin-top:clamp(34px,4vw,54px);}\n.stat{border-top:1px solid rgba(237,242,239,.24);padding-top:22px;}\n.stat .big{font-family:var(--serif);font-weight:700;font-size:clamp(46px,6vw,90px);line-height:.9;color:#F4F7F5;letter-spacing:-.03em;}\n.proto.is-he .stat .big{font-family:var(--he);font-weight:900;}\n.stat .big .u{font-family:var(--mono);font-size:.34em;font-weight:400;color:var(--cta);letter-spacing:.04em;margin-inline-start:.15em;}\n.proto.is-he .stat .big .u{font-family:var(--he);}\n.stat .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,239,231,.6);margin-top:14px;}\n.proto.is-he .stat .lbl{font-family:var(--he);letter-spacing:.02em;text-transform:none;font-weight:600;}\n@media(max-width:820px){ .stats{grid-template-columns:1fr;gap:10px;} .stat{padding-top:24px;} }\n\n/* Testimonial */\n.quote-wrap{max-width:960px;margin-inline:auto;text-align:center;}\n.quote-wrap .mark{display:inline-block;font-family:var(--serif);font-size:72px;color:var(--cta);line-height:.3;transform:translateY(.35em);}\n.quote{font-family:var(--serif);font-weight:300;font-size:clamp(24px,3.4vw,44px);line-height:1.18;letter-spacing:-.015em;color:var(--ink);text-wrap:balance;margin:24px 0 34px;}\n.proto.is-he .quote{font-family:var(--he);font-weight:400;line-height:1.28;}\n.byline{display:inline-flex;flex-direction:column;gap:4px;}\n.byline .who{font-family:var(--serif);font-weight:500;font-size:17px;color:var(--ink);letter-spacing:-.01em;}\n.proto.is-he .byline .who{font-family:var(--he);font-weight:600;}\n.byline .role{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);}\n.proto.is-he .byline .role{font-family:var(--he);letter-spacing:.02em;text-transform:none;font-weight:500;}\n\n/* Tech stack pills */\n.stack-list{list-style:none;padding:0;margin:24px 0 0;display:flex;flex-wrap:wrap;gap:10px;}\n.stack-list li{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--green);border:1px solid var(--line-l);border-radius:999px;padding:8px 14px;background:var(--white);}\n.proto.is-he .stack-list li{font-family:var(--he);letter-spacing:0;}\n\n/* Process mini */\n.proc-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(18px,2vw,28px);margin-top:clamp(30px,4vw,48px);}\n.proc-mini .step{border-top:2px solid var(--cta);padding-top:20px;}\n.proc-mini .n{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--cta);}\n.proto.is-he .proc-mini .n{font-family:var(--he);letter-spacing:.02em;font-weight:600;}\n.proc-mini h4{font-size:19px;color:var(--ink);margin:12px 0 8px;line-height:1.12;}\n.proc-mini p{font-size:14.5px;color:var(--ink-soft);line-height:1.5;}\n@media(max-width:820px){ .proc-mini{grid-template-columns:1fr 1fr;} }\n@media(max-width:520px){ .proc-mini{grid-template-columns:1fr;} }\n\n/* Next case */\n.next{display:flex;align-items:center;justify-content:space-between;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line-l);border-bottom:1px solid var(--line-l);padding:clamp(28px,3.6vw,52px) 0;}\n.next .lbl{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:1 amily:var(--he);letter-spacing:.02em;text-transform:none;}\n.foot-col a{display:block;color:rgba(238,239,231,.72);font-size:14.5px;margin-bottom:10px;transition:color .2s;}\n.foot-col a:hover{color:#fff;}\n.foot-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:26px;font-size:13px;color:rgba(238,239,231,.6);}\n.foot-sig{display:flex;align-items:center;gap:14px;flex-shrink:0;}\n.foot-sig .fs-mark{width:clamp(90px,9vw,124px);height:auto;flex-shrink:0;filter:brightness(0) invert(1);opacity:.78;}\n.proto.is-he .foot-sig .fs-mark{width:clamp(110px,11vw,150px);}\n.foot-sig .fs-en{display:block;}\n.foot-sig .fs-he{display:none;}\n.proto.is-he .foot-sig .fs-en{display:none;}\n.proto.is-he .foot-sig .fs-he{display:block;}\n.foot-sig .fs-cap{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(238,239,231,.42);line-height:1.5;}\n.proto.is-he .foot-sig .fs-cap{font-family:var(--he);letter-spacing:.04em;text-transform:none;font-weight:600;font-size:12px;}\n.foot-sig .fs-cap b{display:block;color:rgba(238,239,231,.72);font-weight:500;letter-spacing:.06em;font-size:11px;margin-bottom:3px;}\n\n/* Reveal */\n.reveal .mask > span{display:block;transform:translateY(110%);transition:transform 1s var(--ease);}\n.reveal.in .mask > span{transform:translateY(0);}\n.fade{opacity:0;transform:translateY(20px);transition:opacity .9s var(--ease),transform .9s var(--ease);}\n.in .fade{opacity:1;transform:translateY(0);}\n.in .fade.d1{transition-delay:.18s;} .in .fade.d2{transition-delay:.34s;} .in .fade.d3{transition-delay:.5s;}\n/* Section entrance cascade — 120ms per element */\n.reveal .cx{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);}\n.reveal.in .cx{opacity:1;transform:none;}\n.reveal.in .cx[data-cx=\"1\"]{transition-delay:.0s;}\n.reveal.in .cx[data-cx=\"2\"]{transition-delay:.12s;}\n.reveal.in .cx[data-cx=\"3\"]{transition-delay:.24s;}\n.reveal.in .cx[data-cx=\"4\"]{transition-delay:.36s;}\n.reveal.in .cx[data-cx=\"5\"]{transition-delay:.48s;}\n\n/* Copper focus ring */\n:focus-visible{outline:2px solid var(--cta);outline-offset:3px;border-radius:2px;}\n\n/* Custom logo cursor */\n.cursor{position:fixed;top:0;left:0;width:30px;height:34px;z-index:9999;pointer-events:none;color:var(--ink);transform:translate(-50%,-50%);will-change:transform;transition:width .22s var(--ease),height .22s var(--ease),opacity .25s,color .3s;opacity:0;}\n.cursor.ready{opacity:1;}\n.cursor.dark{color:#EEEFE7;}\n.cursor.hot{width:48px;height:54px;}\n.cursor svg{width:100%;height:100%;display:block;}\n@media(hover:hover) and (pointer:fine){ .proto,.proto a,.proto button{cursor:none;} }\n@media(hover:none),(pointer:coarse){ .cursor{display:none;} .proto,.proto a,.proto button{cursor:auto;} }\n\n/* Nav auto-hide on scroll down */\n.nav{transition:background .35s,box-shadow .35s,border-color .35s,transform .45s var(--ease),opacity .45s var(--ease);}\n.nav.nav-hide{transform:translateY(-108%);opacity:0;pointer-events:none;}\n\n\n/* Meta strip: line-draw borders */\n.meta{border:0;position:relative;}\n.meta::before,.meta::after{content:\"\";position:absolute;left:0;right:0;height:1px;background:var(--line-l);transform:scaleX(0);transform-origin:50% 50%;transition:transform .8s var(--ease);}\n.meta::before{top:0;} .meta::after{bottom:0;}\n.meta.in-view::before,.meta.in-view::after{transform:scaleX(1);}\n\n/* Cover cinematic entrance */\n.cover-media{position:relative;overflow:hidden;transform:scale(1.06);filter:brightness(.72) saturate(.9);transition:transform 1.1s var(--ease),filter .95s var(--ease);will-change:transform,filter;}\n.cover-media.in-view{transform:scale(1);filter:brightness(1) saturate(1);}\n.cover-media .par{position:absolute;inset:-8px;transition:transform .45s var(--ease);}\n.cover-media image-slot{position:absolute;inset:0;width:100%;height:100%;}\n\n/* Bento tile captions + hover */\n.bento .shot,.gal .shot{cur ח\">Client Name<\u002Fspan><\u002Fdiv>\n        <div class=\"meta-item\"><span class=\"k\" data-he=\"שנה\">Year<\u002Fspan><span class=\"v\">2026<\u002Fspan><\u002Fdiv>\n        <div class=\"meta-item\"><span class=\"k\" data-he=\"תפקיד\">Role<\u002Fspan><span class=\"v\" data-he=\"עיצוב ובנייה\">Design &amp; build<\u002Fspan><\u002Fdiv>\n        <div class=\"meta-item\"><span class=\"k\" data-he=\"קישור\">Live<\u002Fspan><span class=\"v\"><a href=\"#\" target=\"_blank\" rel=\"noopener\" data-he=\"לאתר החי ↗\">Visit site ↗<\u002Fa><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"cover s-light\">\n      <div class=\"wrap\">\n        <div class=\"cover-media\">\n          <div class=\"par\"><image-slot id=\"case-cover\" shape=\"rect\" placeholder=\"Cover screenshot — hero shot of the site (16:9)\" fit=\"cover\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-light\">\n      <div class=\"wrap\">\n        <div class=\"overview\">\n          <div>\n            <span class=\"eyebrow\" data-he=\"הבריף\">The brief<\u002Fspan>\n            <h3 data-he=\"מה היה על השולחן\">What was on the table<\u002Fh3>\n            <p data-he=\"שני משפטים על העסק והמצב שבו הגיע אליי. מה כבר עבד, מה לא, ומה היה חסר.\">Two sentences on the business and the state it came to me in. What already worked, what didn't, and what was missing.<\u002Fp>\n            <p data-he=\"עוד משפט קצר אם צריך — הקהל, השפה, המיקום, כל מה שהשפיע על ההחלטות.\">Another short sentence if needed — audience, language, location, anything that shaped the decisions.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <span class=\"eyebrow\" data-he=\"התוצאה\">The outcome<\u002Fspan>\n            <h3 data-he=\"מה יצא בסוף\">What came out of it<\u002Fh3>\n            <p data-he=\"שני משפטים על התוצר: מה יש בפועל באתר, איך הלקוח משתמש בו, ומה הוא מחליף.\">Two sentences on the outcome: what the site actually does, how the client uses it, and what it replaces.<\u002Fp>\n            <p data-he=\"ואם רלוונטי — עלייה במדדים, זמן שנחסך, או תלונה שנעלמה.\">And where relevant — a metric that moved, time saved, or a complaint that quietly disappeared.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"beat pad s-white\">\n      <div class=\"wrap\">\n        <span class=\"eyebrow\" data-he=\"הרעיון\">The idea<\u002Fspan>\n        <h2 class=\"stack\">\n          <span data-he=\"משפט אחד גדול שמסביר את הפרויקט לכל מי שנכנס.\">One big line that says what this project is, to anyone who walks in.<\u002Fspan>\n        <\u002Fh2>\n        <p data-he=\"אחריו פסקה שקטה שמסבירה למה זו הייתה ההחלטה הנכונה. שני-שלושה משפטים. בלי ז'רגון.\">A quiet paragraph that says why this was the right call. Two or three sentences. No jargon.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-light\">\n      <div class=\"wrap\">\n        <span class=\"eyebrow\" data-he=\"מה נבנה\">What I built<\u002Fspan>\n        <h2 style=\"font-size:clamp(30px,4.4vw,62px);max-width:22ch;\" class=\"edot-after\" data-he=\"החתיכות שמרכיבות את האתר, בצורה שהלקוח יכול לתחזק לבד\">The pieces that make up the site, in a shape the client can maintain alone<\u002Fh2>\n        <div class=\"feats\">\n          <div class=\"feat\">\n            <span class=\"n\">01<\u002Fspan>\n            <h4 data-he=\"עיצוב מותאם\">Custom design<\u002Fh4>\n            <p data-he=\"עיצוב שנבנה סביב המותג והזרימה של העסק, לא סביב תבנית מוכנה.\">A design built around the business's brand and flow, not around a stock template.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"feat\">\n            <span class=\"n\">02<\u002Fspan>\n            <h4 data-he=\"הזמנות ותשלומים\">Bookings &amp; payments<\u002Fh4>\n            <p data-he=\"חיבור מלא לתורים ולתשלומים, כך שכל הזמנה מגיעה ליומן ולחשבון ישירות.\">Full booking and payment wiring, so every reservation lands in the calendar and the account directly.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"feat\">\n            <span class=\"n\">03<\u002Fspan>\n            <h4 data-he=\"דו-לשוני מהיסוד\">Bilingual from the ground up<\u002Fh4>\n            <p data-he=\"אנגלית ועברית, RTL תקין, טפסים ומיילים בשתי השפות.\">English and Hebrew, proper RTL, forms and emails in both languages.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-light\" style=\"padding-top:0;\">\n      <div class=\"wrap\">\n        <span class=\"eyebrow\" data-he=\"גלריה\">Gallery<\u002Fspan>\n        <h2 style=\"font-size:clamp(28px,3.6vw,48px);max-width:22ch;\" class=\"edot-after-g\" data-he=\"כמה מסכים מהאתר החי\">A few screens from the live site<\u002Fh2>\n        <div class=\"gal\">\n          <div class=\"shot wide\"><image-slot id=\"case-g1\" shape=\"rect\" placeholder=\"Hero / feature screen — full width (16:6)\" fit=\"cover\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"orbit-gallery\" data-count=\"4\">\n        <div class=\"og-track\">\n          <div class=\"og-stage\">\n            <div class=\"og-ring\">\n              <span class=\"ring\" aria-hidden=\"true\"><\u002Fspan>\n              <span class=\"ring-tick\" aria-hidden=\"true\"><\u002Fspan>\n              <div class=\"orbit\" aria-hidden=\"true\"><span class=\"bead\"><\u002Fspan><\u002Fdiv>\n              <div class=\"og-inner\">\n                <button type=\"button\" class=\"og-item on\" data-i=\"0\" data-tile-cap=\"Landscape feature — hero UI\">\n                  <image-slot id=\"case-g2\" shape=\"rect\" placeholder=\"Detail shot — landscape feature\" fit=\"cover\"><\u002Fimage-slot>\n                  <span class=\"og-info\"><span class=\"tag\" data-he=\"מסך ראשי\">Feature<\u002Fspan><span class=\"t\" data-he=\"מסך פיצ׳ר בפריסה רחבה\">Landscape feature<\u002Fspan><p data-he=\"מסך הראשי של האתר — =\"u\">h/wk<\u002Fspan><\u002Fdiv>\n                <div class=\"lbl\" data-he=\"עבודה ידנית שנחסכה\">Manual work saved<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"stat\">\n                <div class=\"big\"><span data-i18n=\"\">2<\u002Fspan><span class=\"u\">lang<\u002Fspan><\u002Fdiv>\n                <div class=\"lbl\" data-he=\"שפות, מיום ההשקה\">Languages, from day one<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-light\" style=\"padding-top:0;\">\n      <div class=\"wrap\">\n        <div class=\"quote-wrap\">\n          <span class=\"mark\">\"<\u002Fspan>\n          <p class=\"quote\" data-he=\"מקום לציטוט של הלקוח. שני-שלושה משפטים ששוברים את השקט, בטון שלו. שים כאן משהו שאף אחד אחר לא יכול היה לומר.\">A place for the client's own words. Two or three sentences that break the quiet, in their voice. Put something here that nobody else could have said.<\u002Fp>\n          <span class=\"byline\">\n            <span class=\"who\" data-he=\"שם הלקוח\">Client Name<\u002Fspan>\n            <span class=\"role\" data-he=\"תפקיד · עסק\">Role · Company<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-white\">\n      <div class=\"wrap\">\n        <span class=\"eyebrow\" data-he=\"איך זה נעשה\">How it was made<\u002Fspan>\n        <h2 style=\"font-size:clamp(30px,4.4vw,62px);max-width:22ch;\" class=\"edot-after\" data-he=\"ארבעה שלבים, מהשיחה הראשונה עד המפתחות\">Four steps, from the first call to the keys<\u002Fh2>\n        <div class=\"proc-mini\">\n          <div class=\"step\"><span class=\"n\">01<\u002Fspan><h4 data-he=\"שיחת היכרות\">Discovery call<\u002Fh4><p data-he=\"מדברים על העסק ומה האתר צריך לעשות בפועל.\">We talk about the business and what the site actually needs to do.<\u002Fp><\u002Fdiv>\n          <div class=\"step\"><span class=\"n\">02<\u002Fspan><h4 data-he=\"עיצוב ואישור\">Design &amp; approve<\u002Fh4><p data-he=\"אני מעצב את העמודים ואתה מאשר לפני שנבנה משהו.\">I design the pages and you approve before anything gets built.<\u002Fp><\u002Fdiv>\n          <div class=\"step\"><span class=\"n\">03<\u002Fspan><h4 data-he=\"בנייה וחיבור\">Build &amp; connect<\u002Fh4><p data-he=\"בונה בוורדפרס, מחבר תורים, תשלומים וטפסים.\">Built in WordPress; booking, payments and forms all wired.<\u002Fp><\u002Fdiv>\n          <div class=\"step\"><span class=\"n\">04<\u002Fspan><h4 data-he=\"השקה ומסירה\">Launch &amp; handover<\u002Fh4><p data-he=\"עולים לאוויר ואני מוסר לך את המפתחות.\">We go live and I hand over the keys.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <span class=\"eyebrow\" style=\"margin-top:56px;\" data-he=\"הכלים\">Under the hood<\u002Fspan>\n        <ul class=\"stack-list\">\n          <li>WordPress<\u002Fli>\n          <li>ACF Pro<\u002Fli>\n          <li>WooCommerce<\u002Fli>\n          <li>Stripe<\u002Fli>\n          <li>WPML<\u002Fli>\n          <li>Custom theme<\u002Fli>\n          <li data-he=\"דומיין · אחסון\">Domain · Hosting<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"pad s-light\" style=\"padding-top:0;\">\n      <div class=\"wrap\">\n        <a class=\"next\" href=\"#\">\n          <div>\n            <span class=\"lbl\" data-he=\"הפרויקט הבא\">Next project<\u002Fspan>\n            <h3 data-he=\"שם הפרויקט הבא בסדרה.\">The next project in the series.<\u002Fh3>\n          <\u002Fdiv>\n          <span class=\"go\"><span data-he=\"לצפייה\">View case<\u002Fspan><span class=\"ar\" aria-hidden=\"true\">→<\u002Fspan><\u002Fspan>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"cta pad\">\n      <div class=\"wrap\">\n        <span class=\"eyebrow\" style=\"color:var(--green-lt);\" data-he=\"הבא בתור\">Next in line<\u002Fspan>\n        <h2 class=\"stack\" style=\"line-height:.95;\">\n .\">Independent web studio — websites &amp; systems for small business. Working in English &amp; Hebrew, worldwide.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"foot-sig\" aria-hidden=\"true\">\n            <img class=\"fs-mark fs-en\" src=\"62f88403-ef2e-4e65-8a1a-f4309ef9427a\" alt=\"\">\n            <img class=\"fs-mark fs-he\" src=\"93186f6f-8aba-40eb-b2b2-f91abdf268d8\" alt=\"\">\n            <div class=\"fs-cap\"><b data-he=\"עבודת יד\">Hand crafted<\u002Fb><span data-he=\"עמרי נחום\">Omri Nachum<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"foot-cols\">\n            <div class=\"foot-col\"><h4 data-he=\"ניווט\">Navigate<\u002Fh4><a href=\"./Omri Nachum Web Studio.dc.html#work\" data-he=\"עבודות\">Work<\u002Fa><a href=\"./Omri Nachum Web Studio.dc.html#services\" data-he=\"שירותים\">Services<\u002Fa><a href=\"./Omri Nachum Web Studio.dc.html#pricing\" data-he=\"מחירים\">Pricing<\u002Fa><a href=\"./Omri Nachum Web Studio.dc.html#faq\" data-he=\"שאלות\">FAQ<\u002Fa><\u002Fdiv>\n            <div class=\"foot-col\"><h4 data-he=\"יצירת קשר\">Contact<\u002Fh4><a href=\"mailto:hello@example.com\">hello@example.com<\u002Fa><a href=\"#\" data-he=\"וואטסאפ\">WhatsApp<\u002Fa><a href=\"#\">Instagram<\u002Fa><a href=\"#\">LinkedIn<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"foot-bottom\">\n          <span data-he=\"© 2026 עמרי נחום · סטודיו לאתרים\">© 2026 Omri Nachum · Web Studio<\u002Fspan>\n          <span class=\"foot-cred\" style=\"margin:0;\" data-he=\"נבנה בוורדפרס · WooCommerce · Amelia · Stripe\">Built on WordPress · WooCommerce · Amelia · Stripe<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fmain>\n\n  <div class=\"tile-modal\" aria-hidden=\"true\">\n    <div class=\"scrim\" data-tm-close=\"\"><\u002Fdiv>\n    <div class=\"stage\">\n      <div class=\"frame\">\n        <button type=\"button\" class=\"tm-close\" aria-label=\"Close\" data-tm-close=\"\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6l-12 12\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n        <div class=\"tm-body\"><\u002Fdiv>\n        <div class=\"tm-cap\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount(){\n    const proto = document.querySelector('.proto');\n\n    // ---- Section entrance cascade: tag key children with data-cx\n    document.querySelectorAll('.reveal, .pad > .wrap, section .wrap').forEach(w=>{\n      // decorate direct-child eyebrow/h1/h2/h3/p/visual with cascade indexes\n      const wrapper = w.classList.contains('reveal') ? w : w.closest('.reveal, section');\n      if(!wrapper) return;\n      const kids = w.querySelectorAll(':scope > .eyebrow, :scope > h1, :scope > h2, :scope > h3, :scope > p, :scope > .row, :scope > .feats, :scope > .gal, :scope > .bento, :scope > .stack-list, :scope > .proc-mini');\n      let i=1;\n      kids.forEach(k=>{ if(i<=5){ k.classList.add('cx'); k.setAttribute('data-cx', String(i)); i++; } });\n    });\n\n    // wrap sections in .reveal if missing\n    document.querySelectorAll('main > section, main > .wrap').forEach(s=>{ if(!s.classList.contains('reveal')) s.classList.add('reveal'); });\n\n    // ---- Intersection reveals\n    const io = new IntersectionObserver((entries)=>{\n      entries.forEach(e=>{\n        if(e.isIntersecting){\n          e.target.classList.add('in');\n          if(e.target.classList.contains('meta')) e.target.classList.add('in-view');\n          if(e.target.classList.contains('cover-media')) e.target.classList.add('in-view');\n          if(e.target.classList.contains('proc-mini')) e.target.classList.add('in-view');\n          io.unobserve(e.target);\n        }\n      });\n    },{threshold:.16});\n    document.querySelectorAll('.reveal, .beat, .feats, .gal, .bento, .stats, .proc-mini, .quote-wrap, .next, .meta, .cover-media').forEach(el=>io.observe(el));\n    // Kinetic hero: fire the case-hero reveal on load after first paint\n    requestAnimationFrame(()=> requestAnimationFrame(()=>{\n      const h = document.querySelector('.case-hero');\n      if(h) h.classList.add('in');\n    }));\n\n    // ---- Nav solid + auto-hide on scroll direction\n    const nav = document.querySelector('.nav');\n    const cta = document.querySelector('.cta');\n    const hero = document.querySelector('.case-hero');\n    let lastY = window.scrollY;\n    const onScroll = ()=>{\n      const y = window.scrollY;\n      const goingDown = y > lastY + 4;\n      const goingUp = y < lastY - 4;\n      if(nav){\n        nav.classList.add('solid');\n        nav.classList.remove('nav-hide');\n      }\n      lastY = y;\n    };\n    onScroll();\n    window.addEventListener('scroll', onScroll, {passive:true});\n\n    // ---- Custom cursor\n    const cursor = document.querySelector('.cursor');\n    let cx = window.innerWidth/2, cy = window.innerHeight/2, tx = cx, ty = cy;\n    const HOT_SEL = 'a, button, [role=\"button\"], .bento .shot, .gal .shot, [data-tile-cap]';\n    const move = (e)=>{\n      tx = e.clientX; ty = e.clientY;\n      if(!cursor.classList.contains('ready')) cursor.classList.add('ready');\n    };\n    window.addEventListener('mousemove', move, {passive:true});\n    window.addEventListener('mouseleave', ()=>cursor.classList.remove('ready'));\n    document.addEventListener('mouseover', (e)=>{\n      const hit = e.target.closest(HOT_SEL);\n      cursor.classList.toggle('hot', !!hit);\n      // switch color: dark backgrounds => light cursor\n      const themed = e.target.closest('.s-dark, .s-dark2, .cta, .foot, .results, .tile-modal');\n      cursor.classList.toggle('dark', !!themed);\n    });\n    const cursorTick = ()=>{\n      cx += (tx - cx) * .22; cy += (ty - cy) * .22;\n      if(cursor) cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%,-50%)`;\n      requestAnimationFrame(cursorTick);\n    };\n    requestAnimationFrame(cursorTick);\n\n    // ---- Cursor-parallax on cover image\n    const cover = document.querySelector('.cover-media');\n    const par = cover && cover.querySelector('.par');\n    if(cover && par){\n      cover.addEventListener('mousemove', (e)=>{\n        const r = cover.getBoundingClientRect();\n        const nx = (e.clientX - r.left)/r.width - .5;\n        const ny = (e.clientY - r.top)/r.height - .5;\n        par.style.transform = `translate(${-nx*6}px, ${-ny*6}px)`;\n      });\n      cover.addEventListener('mouseleave', ()=>{ par.style.transform = 'translate(0,0)'; });\n    }\n\n    // ---- Tile expand modal\n    const modal = document.querySelector('.tile-modal');\n    const modalBody = modal && modal.querySelector('.tm-body');\n    const modalCap = modal && modal.querySelector('.tm-cap');\n    const openTile = (tile)=>{\n      if(!modal) return;\n      const src = tile.querySelector('image-slot, img');\n      modalBody.innerHTML = '';\n      if(src){\n        const clone = src.cloneNode(true);\n        clone.removeAttribute('id');\n        modalBody.appendChild(clone);\n      }\n      const cap = tile.getAttribute('data-tile-cap') || (tile.querySelector('.b-t')?.textContent) || '';\n      modalCap.textContent = cap;\n      modal.classList.add('open');\n      modal.setAttribute('aria-hidden', 'false');\n      document.body.style.overflow = 'hidden';\n    };\n    const closeTile = ()=>{\n      if(!modal) return;\n      modal.classList.remove('open');\n      modal.setAttribute('aria-hidden', 'true');\n      document.body.style.overflow = '';\n    };\n    document.querySelectorAll('.bento .shot, .gal .shot').forEach(t=>{\n      t.setAttribute('role','button');\n      t.setAttribute('tabindex','0');\n      t.addEventListener('click', ()=>openTile(t));\n      t.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openTile(t); } });\n    });\n    modal && modal.querySelectorAll('[data-tm-close]').forEach(el=> el.addEventListener('click', closeTile));\n    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeTile(); });\n\n    // ---- Orbit gallery: scroll-driven ring\n    const og = document.querySelector('.orbit-gallery');\n    if(og){\n      const track = og.querySelector('.og-track');\n      const orbit = og.querySelector('.og-ring .orbit');\n      const items = Array.from(og.querySelectorAll('.og-item'));\n      const nums = Array.from(og.querySelectorAll('.og-nums li'));\n      const mob = og.querySelector('.og-mobile');\n      const mobTag = mob && mob.querySelector('.tag');\n      const mobT   = mob && mob.querySelector('.t');\n      const mobP   = mob && mob.querySelector('p');\n      const count = items.length;\n      let curIdx = -1;\n      const syncMobile = (idx)=>{\n        if(!mob) return;\n        const active = items[idx]; if(!active) return;\n        const info = active.querySelector('.og-info');\n        const getEn = (el)=> el ? (el.dataset && el.dataset.en !== undefined ? el.dataset.en : el.textContent) : '';\n        const getHe = (el)=> el ? (el.getAttribute('data-he') || el.textContent) : '';\n        const isHe = document.querySelector('.proto').classList.contains('is-he');\n        const pick = (el)=> isHe ? getHe(el) : getEn(el);\n        mob.classList.remove('ready');\n        setTimeout(()=>{\n          mobTag.textContent = pick(info.querySelector('.tag'));\n          mobT.textContent   = pick(info.querySelector('.t'));\n          mobP.textContent   = pick(info.querySelector('p'));\n          mob.classList.add('ready');\n        }, 140);\n      };\n      const updateOG = ()=>{\n        if(!track) return;\n        const rect = track.getBoundingClientRect();\n        const vh = window.innerHeight;\n        const total = rect.height - vh;\n        const raw = -rect.top / (total || 1);\n        const p = Math.max(0, Math.min(1, raw));\n        orbit.style.transform = `rotate(${p * 360 * count}deg)`;\n        const idx = Math.min(count - 1, Math.floor(p * count * 0.9999));\n        if(idx !== curIdx){\n          items.forEach((it,i)=> it.classList.toggle('on', i === idx));\n          nums.forEach((n,i)=> n.classList.toggle('on', i === idx));\n          syncMobile(idx);\n          curIdx = idx;\n        }\n      };\n      updateOG();\n      window.addEventListener('scroll', updateOG, {passive:true});\n      window.addEventListener('resize', updateOG);\n      // click any og-item to open modal\n      items.forEach(it=>{\n        it.addEventListener('click', ()=>openTile(it));\n      });\n      // click a number to snap-scroll to that item\n      nums.forEach((n, i)=>{\n        n.addEventListener('click', ()=>{\n          const rect = track.getBoundingClientRect();\n          const vh = window.innerHeight;\n          const total = rect.height - vh;\n          const targetP = (i + 0.5) / count;\n          const targetY = window.scrollY + rect.top + targetP * total;\n          window.scrollTo({top: targetY, behavior:'smooth'});\n        });\n      });\n    }\n\n    // ---- Language toggle\n    const setLang = (lang)=>{\n      document.querySelectorAll('[data-he]').forEach(el=>{\n        if(el.dataset.en === undefined) el.dataset.en = el.textContent;\n        el.textContent = (lang === 'he') ? el.getAttribute('data-he') : el.dataset.en;\n      });\n      proto.classList.toggle('is-he', lang === 'he');\n      proto.setAttribute('dir', lang === 'he' ? 'rtl' : 'ltr');\n      document.querySelectorAll('[data-lang-btn]').forEach(b=>b.classList.toggle('on', b.dataset.langBtn === lang));\n    };\n    document.querySelectorAll('[data-lang-btn]').forEach(btn=>{\n      btn.addEventListener('click', ()=>setLang(btn.dataset.langBtn));\n    });\n\n    // ---- Mobile drawer (burger)\n    const drawer = document.getElementById('nav-drawer');\n    const burger = document.querySelector('.nav-burger');\n    const openDrawer = ()=>{\n      if(!drawer) return;\n      drawer.classList.add('open');\n      drawer.setAttribute('aria-hidden','false');\n      document.querySelector('.nav')?.classList.add('menu-open');\n      burger?.setAttribute('aria-expanded','true');\n      document.body.style.overflow = 'hidden';\n    };\n    const closeDrawer = ()=>{\n      if(!drawer) return;\n      drawer.classList.remove('open');\n      drawer.setAttribute('aria-hidden','true');\n      document.querySelector('.nav')?.classList.remove('menu-open');\n      burger?.setAttribute('aria-expanded','false');\n      document.body.style.overflow = '';\n    };\n    burger?.addEventListener('click', ()=>{\n      const isOpen = drawer?.classList.contains('open');\n      isOpen ? closeDrawer() : openDrawer();\n    });\n    document.querySelectorAll('[data-nd-close]').forEach(el=>el.addEventListener('click', closeDrawer));\n    window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') closeDrawer(); });\n\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
