<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omri Nachum Web Studio — Design Previews</title>
<style>
  :root{
    --paper:#E5E5D7; --ink:#1C1B19; --ink-soft:#2E4040;
    --cta:#A07840; --green:#1F5D4C; --green-lt:#6A9E90;
  }
  *{box-sizing:border-box;margin:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Hanken Grotesk',system-ui,sans-serif;
    min-height:100vh; padding:clamp(40px,8vw,120px) clamp(24px,5vw,80px);
    line-height:1.6;
  }
  h1{
    font-family:Georgia,serif;
    font-weight:300;
    font-size:clamp(38px,6vw,80px);
    line-height:.9; letter-spacing:-.02em;
    max-width:20ch; margin-bottom:24px;
  }
  h1 b{ font-weight:800; text-transform:uppercase; }
  h1 b::after{ content:"."; color:var(--cta); }
  .eyebrow{
    font-family:ui-monospace,monospace;
    font-size:12px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--cta); display:block; margin-bottom:22px;
  }
  p{ max-width:56ch; color:var(--ink-soft); font-size:17px; margin-bottom:36px; }
  ul{ list-style:none; padding:0; display:flex; flex-direction:column; gap:14px; }
  a{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 28px; border:1px solid rgba(28,27,25,.16); border-radius:14px;
    background:#FBFBF6; color:var(--ink); text-decoration:none;
    font-size:20px; font-family:Georgia,serif;
    transition:border-color .2s, transform .2s;
  }
  a:hover{ border-color:var(--cta); transform:translateY(-2px); }
  a span{ font-family:ui-monospace,monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--cta); }
  footer{ margin-top:64px; font-family:ui-monospace,monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); }
</style>
</head>
<body>
  <span class="eyebrow">Design references</span>
  <h1>Omri Nachum <b>Web Studio</b></h1>
  <p>Two static, self-contained previews of the finished design. Open in any browser — everything is inlined, no server needed.</p>
  <ul>
    <li><a href="./home.html">Homepage (v3) <span>Open →</span></a></li>
    <li><a href="./case-study.html">Case Study template <span>Open →</span></a></li>
  </ul>
  <footer>Handoff for WordPress + Elementor build</footer>
</body>
</html>
